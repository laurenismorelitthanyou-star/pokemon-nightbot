<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokémon Randomizer</title>
</head>

<body>
    <h1>Pokémon Randomizer</h1>
    <p id="pokemon">Loading...</p>

    <script>
        const pokemon = [
            "Umbreon",
            "Mimikyu",
            "Sylveon",
            "Eevee",
            "Vaporeon",
            "Rayquaza",
            "Lucario",
            "Chandelure",
            "Mew",
            "Espeon"
        ];

        const randomPokemon = pokemon[Math.floor(Math.random() * pokemon.length)];

        document.getElementById("pokemon").textContent = randomPokemon;
    </script>
</body>
</html>
